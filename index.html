<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Blind Designs — Staff Tools</title>
<style>
  :root { --ink:#3e3e3a; --grey:#8b8a82; --blush:#9c6a58; --paper:#faf9f6; }
  html,body { height:100%; margin:0; }
  body { display:flex; align-items:center; justify-content:center; background:#edebe6;
         font-family:'PT Sans',Arial,Helvetica,sans-serif; color:var(--ink); }
  .card { background:var(--paper); border:1px solid #d8d6cd; border-radius:10px; padding:34px 38px;
          box-shadow:0 2px 14px rgba(62,62,58,.18); width:min(92vw,380px); text-align:center; }
  h1 { font-size:17px; letter-spacing:.14em; margin:0 0 4px; }
  .sub { font-size:12px; letter-spacing:.22em; color:var(--grey); margin-bottom:22px; }
  input { width:100%; box-sizing:border-box; font-size:16px; padding:10px 12px; border:1px solid #c9c7bf;
          border-radius:6px; text-align:center; letter-spacing:.06em; }
  button { margin-top:12px; width:100%; font-size:14px; letter-spacing:.1em; padding:10px 0; border:0;
           border-radius:6px; background:var(--ink); color:#fff; cursor:pointer; }
  button:disabled { opacity:.55; cursor:wait; }
  label.rem { display:flex; gap:7px; justify-content:center; align-items:center; font-size:12.5px;
              color:var(--grey); margin-top:12px; }
  .err { color:#b3261e; font-size:12.5px; min-height:17px; margin-top:10px; }
  .foot { font-size:11px; color:var(--grey); margin-top:18px; line-height:1.5; }
</style>
</head>
<body>
<div class="card">
  <h1>BLIND DESIGNS</h1>
  <div class="sub">BEND &amp; BLIND VISUALISER — STAFF ONLY</div>

    <button id="b" type="submit">Unlock</button>
    <label class="rem"><input id="rem" type="checkbox"> Remember on this device</label>
    <div class="err" id="e"></div>
  </form>
  <div class="foot">Authorised Blind Designs staff only.<br>This page holds no readable data without the passphrase.</div>
</div>

const u8 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
const LS = 'bd-visualiser-key';
async function keyFromPass(pass) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(SALT), iterations: ITER, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function tryOpen(key, onOk) {
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(IV) }, key, u8(DATA)); // throws if wrong
  if (onOk) { try { onOk(); } catch (_) {} }
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
  return true;
}
async function autoUnlock() {
  const card = document.querySelector('.card');
  // 1) key carried in the URL fragment (e.g. the staff SharePoint embed): #k=<base64url>
  try {
    const m = (location.hash || '').match(/[#&]k=([A-Za-z0-9_-]+)/);
    if (m) {
      let s = m[1].replace(/-/g, '+').replace(/_/g, '/');
      while (s.length % 4) s += '=';
      if (card) card.style.visibility = 'hidden';
      const kb = Uint8Array.from(atob(s), c => c.charCodeAt(0));
      await tryOpen(await crypto.subtle.importKey('raw', kb, 'AES-GCM', true, ['decrypt']), () => {
        // SCRUB: remove the key from the address bar + this history entry the moment
        // decryption succeeds. Copying the URL now shares only the lock screen; the key
        // is stashed for THIS TAB only so a reload keeps working (dies with the tab).
        try { sessionStorage.setItem(LS + '-tab', btoa(String.fromCharCode.apply(null, kb))); } catch (_) {}
        try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
      });
      return;
    }
  } catch (e) { if (card) card.style.visibility = ''; }
  // 1b) key stashed for this tab (a scrubbed full-screen view being reloaded)
  try {
    const tab = sessionStorage.getItem(LS + '-tab');
    if (tab) {
      if (card) card.style.visibility = 'hidden';
      await tryOpen(await crypto.subtle.importKey('raw', u8(tab), 'AES-GCM', true, ['decrypt']));
      return;
    }
  } catch (e) { if (card) card.style.visibility = ''; try { sessionStorage.removeItem(LS + '-tab'); } catch (_) {} }
  // 2) key remembered on this device
  try {
    const saved = localStorage.getItem(LS);
    if (saved) await tryOpen(await crypto.subtle.importKey('raw', u8(saved), 'AES-GCM', true, ['decrypt']));
  } catch (e) { try { localStorage.removeItem(LS); } catch (_) {} }
}
// document.open() must only run once parsing has finished, or remnants of this
// page survive underneath the decrypted app
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => { autoUnlock(); });
else autoUnlock();
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = document.getElementById('b'), err = document.getElementById('e');
  btn.disabled = true; err.textContent = '';
  try {
    const key = await keyFromPass(document.getElementById('p').value);
    if (document.getElementById('rem').checked) {
      const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
      try { localStorage.setItem(LS, btoa(String.fromCharCode.apply(null, raw))); } catch (_) {}
    }
    await tryOpen(key);
  } catch (e) {
    err.textContent = 'Wrong passphrase — try again.';
    btn.disabled = false;
  }
});
